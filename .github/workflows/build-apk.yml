name: Build Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
      - 'public/brand/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build AI Botflow CRM APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true

      - name: Make Gradlew Executable
        run: |
          chmod +x android-app/gradlew

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk build-output/ai-botflow-crm.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-botflow-crm-apk
          path: build-output/ai-botflow-crm.apk
          if-no-files-found: error

      - name: Update Downloadable APK in Repository
        run: |
          mkdir -p public/downloads
          cp build-output/ai-botflow-crm.apk public/downloads/ai-botflow-crm.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ai-botflow-crm.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(mobile): update downloadable APK with new launcher icon [skip ci]"
            git push origin main
          fi

