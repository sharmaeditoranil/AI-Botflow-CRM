name: Build Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build AI Botflow CRM APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android-app
          gradle assembleDebug --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk build-output/ai-botflow-crm.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-botflow-crm-apk
          path: build-output/ai-botflow-crm.apk
          if-no-files-found: error
