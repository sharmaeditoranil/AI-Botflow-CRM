<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Botflow CRM</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f6f8f7; color: #111b21;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { text-align: center; max-width: 360px; padding: 32px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #54656f; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #00a884; color: #fff; border: 0; border-radius: 999px; padding: 10px 24px;
             font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #008f72; }
    .dot { width: 56px; height: 56px; border-radius: 50%; background: #d9fdd3; display: inline-grid; place-items: center; font-size: 26px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot">📡</div>
    <h1>Can't reach AI Botflow</h1>
    <p>Check your internet connection. The app will reconnect automatically.</p>
    <button id="retry">Try again</button>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get('url') || 'https://dash.aibotflow.in/inbox'
    const safe = /^https:\/\/dash\.aibotflow\.in\//.test(target) ? target : 'https://dash.aibotflow.in/inbox'
    const go = () => { location.href = safe }
    document.getElementById('retry').onclick = go
    window.addEventListener('online', go)
    setInterval(() => { if (navigator.onLine) go() }, 15000)
  </script>
</body>
</html>
